name: Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: rabel798679
          key: ${{ secrets.AZURE_SSH_KEY }}
          capture_stdout: true
          script: |
             whoami
             cd C:/Users/rabel798679/Projects/lab-project
             "C:/Program Files/Git/cmd/git.exe" fetch origin
             echo FETCH_DONE
             "C:/Program Files/Git/cmd/git.exe" rev-parse origin/main
             "C:/Program Files/Git/cmd/git.exe" reset --hard origin/main
             echo RESET_DONE
             "C:/Program Files/Git/cmd/git.exe" rev-parse HEAD
