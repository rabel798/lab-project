<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>EmergencyPay - Receive Offline Payments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: #131b2e;
      --emerald-primary: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.25);
      --teal-accent: #06b6d4;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius-md: 14px;
      --radius-lg: 20px;
      --font-family: 'Exo 2', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    
    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 20px; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); }
    .back-btn { color: var(--text-main); text-decoration: none; font-size: 1.2rem; display: flex; align-items: center; gap: 6px; }
    .header-title { font-weight: 700; font-size: 1.1rem; }

    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }

    .qr-box { background: #fff; border-radius: var(--radius-md); padding: 16px; width: 220px; height: 220px; display: grid; place-items: center; box-shadow: 0 0 25px var(--emerald-glow); }
    .qr-box svg { width: 100%; height: 100%; }

    .vpa-display { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px 20px; font-weight: 700; font-size: 1rem; color: var(--emerald-primary); width: 100%; display: flex; justify-content: space-between; align-items: center; }

    .channel-badge { display: flex; items-center: center; gap: 6px; font-size: 0.85rem; color: var(--text-muted); background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 6px 14px; border-radius: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/emergencypay" class="back-btn"><i class="ri-arrow-left-line"></i> Dashboard</a>
      <span class="header-title">Receive Payment</span>
      <div style="width: 24px;"></div>
    </header>

    <div class="card">
      <div class="channel-badge">
        <i class="ri-wifi-off-line"></i>
        <span>Offline Beacon Active</span>
      </div>

      <div class="qr-box">
        <!-- SVG Simulated QR Code -->
        <svg viewBox="0 0 100 100" fill="#0b0f19">
          <rect x="0" y="0" width="30" height="30" />
          <rect x="5" y="5" width="20" height="20" fill="#fff" />
          <rect x="10" y="10" width="10" height="10" />
          <rect x="70" y="0" width="30" height="30" />
          <rect x="75" y="5" width="20" height="20" fill="#fff" />
          <rect x="80" y="10" width="10" height="10" />
          <rect x="0" y="70" width="30" height="30" />
          <rect x="5" y="75" width="20" height="20" fill="#fff" />
          <rect x="10" y="80" width="10" height="10" />
          <rect x="40" y="10" width="15" height="15" />
          <rect x="40" y="40" width="20" height="20" />
          <rect x="70" y="40" width="15" height="15" />
          <rect x="10" y="45" width="15" height="15" />
          <rect x="40" y="70" width="20" height="20" />
          <rect x="70" y="70" width="20" height="20" />
        </svg>
      </div>

      <div class="vpa-display">
        <span>merchant@emergencypay</span>
        <i class="ri-file-copy-line" style="cursor:pointer;" onclick="copyVpa()"></i>
      </div>

      <p style="font-size:0.85rem; color: var(--text-muted);">
        Show this offline QR code to the payer. The encrypted payment token will transfer over local Bluetooth mesh.
      </p>
    </div>
  </div>

  <script>
    function copyVpa() {
      navigator.clipboard.writeText('merchant@emergencypay');
      alert('Merchant VPA copied to clipboard!');
    }
  </script>
</body>
</html>
