<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>EmergencyPay - Receive Payment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --primary: #3f3fe9;
      --primary-100: #e8e8fd;
      --primary-50: #f4f4fe;
      --emergency: #dc2626;
      --bg-page: #f9fafb;
      --card-bg: #ffffff;
      --border-color: #e5e7eb;
      --text-main: #111827;
      --text-muted: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Exo 2', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-page); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; }

    .app-shell { width: 100%; max-width: 448px; min-height: 100vh; background: #fff; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 25px rgba(0,0,0,0.05); }

    /* Top Bar */
    .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border-color); background: #fff; position: sticky; top: 0; z-index: 20; }
    .back-btn { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--text-main); font-size: 1.3rem; transition: background 0.15s; }
    .back-btn:hover { background: #f3f4f6; }
    .top-title { font-size: 1.15rem; font-weight: 600; }

    .content-scroll { flex: 1; overflow-y: auto; padding: 24px 20px 80px; display: flex; flex-direction: column; align-items: center; text-align: center; }

    /* Beacon Badge */
    .beacon-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; color: #16a34a; background: #dcfce7; padding: 6px 14px; border-radius: 20px; margin-bottom: 20px; }
    .beacon-pulse { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; animation: pulse 1.5s infinite; }

    /* QR Box */
    .qr-card { background: #fff; border: 1.5px solid var(--border-color); border-radius: 20px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; }
    .qr-frame { width: 220px; height: 220px; background: #fff; border: 1px solid var(--border-color); border-radius: 14px; padding: 12px; display: flex; align-items: center; justify-content: center; }
    .qr-frame svg { width: 100%; height: 100%; }

    /* VPA Display Box */
    .vpa-box { width: 100%; background: var(--primary-50); border: 1px solid #e0e0fc; border-radius: 12px; padding: 12px 16px; margin-top: 18px; display: flex; align-items: center; justify-content: space-between; }
    .vpa-text { font-size: 0.95rem; font-weight: 700; color: var(--primary); }
    .btn-copy { background: transparent; border: none; color: var(--primary); font-size: 1.25rem; cursor: pointer; padding: 4px; }

    .qr-hint { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; margin-top: 14px; }

    /* Info card */
    .mesh-info-card { width: 100%; max-width: 320px; background: #f9fafb; border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; margin-top: 20px; text-align: left; }
    .info-row { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: #4b5563; }
    .info-row i { font-size: 1.2rem; color: var(--primary); }

    /* Bottom Navigation Dock */
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 448px; background: #fff; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 8px 0; z-index: 40; }
    .nav-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #6b7280; font-size: 0.72rem; font-weight: 500; gap: 3px; width: 68px; position: relative; }
    .nav-tab i { font-size: 1.3rem; }
    .nav-tab.active { color: var(--primary); font-weight: 600; }

    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="app-shell">
    
    <!-- Top Bar -->
    <header class="top-bar">
      <a href="/emergencypay" class="back-btn">
        <i class="ri-arrow-left-line"></i>
      </a>
      <h1 class="top-title">Receive Payment</h1>
      <div style="width: 36px;"></div>
    </header>

    <div class="content-scroll">
      <!-- Active Beacon Badge -->
      <div class="beacon-badge">
        <span class="beacon-pulse"></span>
        <span>Offline Beacon Broadcasting</span>
      </div>

      <!-- QR Card -->
      <section class="qr-card">
        <div class="qr-frame">
          <svg viewBox="0 0 100 100" fill="#111827">
            <rect x="0" y="0" width="30" height="30" />
            <rect x="5" y="5" width="20" height="20" fill="#fff" />
            <rect x="10" y="10" width="10" height="10" />
            <rect x="70" y="0" width="30" height="30" />
            <rect x="75" y="5" width="20" height="20" fill="#fff" />
            <rect x="80" y="10" width="10" height="10" />
            <rect x="0" y="70" width="30" height="30" />
            <rect x="5" y="75" width="20" height="20" fill="#fff" />
            <rect x="10" y="80" width="10" height="10" />
            <rect x="40" y="10" width="15" height="15" />
            <rect x="40" y="40" width="20" height="20" />
            <rect x="70" y="40" width="15" height="15" />
            <rect x="10" y="45" width="15" height="15" />
            <rect x="40" y="70" width="20" height="20" />
            <rect x="70" y="70" width="20" height="20" />
          </svg>
        </div>

        <div class="vpa-box">
          <span class="vpa-text" id="vpaVal">rahul@emergencypay</span>
          <button class="btn-copy" onclick="copyVpa()" title="Copy VPA">
            <i class="ri-file-copy-line"></i>
          </button>
        </div>

        <p class="qr-hint">
          Scan this offline QR code with any nearby EmergencyPay app. Encrypted transfer will complete over local Bluetooth Low Energy mesh.
        </p>
      </section>

      <!-- Mesh Specs -->
      <div class="mesh-info-card">
        <div class="info-row">
          <i class="ri-bluetooth-line"></i>
          <span>Bluetooth Low Energy (10m range active)</span>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Dock -->
    <nav class="bottom-nav">
      <a href="/emergencypay" class="nav-tab">
        <i class="ri-home-5-line"></i>
        <span>Home</span>
      </a>
      <a href="/scan" class="nav-tab">
        <i class="ri-qr-scan-line"></i>
        <span>Scan</span>
      </a>
      <a href="/bluetooth" class="nav-tab">
        <i class="ri-bluetooth-line"></i>
        <span>Pay BT</span>
      </a>
      <a href="/history" class="nav-tab">
        <i class="ri-history-line"></i>
        <span>History</span>
      </a>
      <a href="/profile" class="nav-tab">
        <i class="ri-user-3-line"></i>
        <span>Profile</span>
      </a>
    </nav>

  </div>

  <script>
    async function loadUser() {
      try {
        const res = await fetch('/api/user');
        if (res.ok) {
          const u = await res.json();
          const cleanName = (u.name || 'rahul').toLowerCase().replace(/[^a-z0-9]/g, '');
          document.getElementById('vpaVal').textContent = `${cleanName}@emergencypay`;
        }
      } catch (e) {}
    }

    function copyVpa() {
      const vpa = document.getElementById('vpaVal').textContent;
      navigator.clipboard.writeText(vpa);
      alert(`UPI VPA "${vpa}" copied to clipboard!`);
    }

    loadUser();
  </script>
</body>
</html>
