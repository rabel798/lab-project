<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>EmergencyPay - Scan QR Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --primary: #3f3fe9;
      --primary-100: #e8e8fd;
      --emergency: #dc2626;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Exo 2', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0b0f19; color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; }

    .app-shell { width: 100%; max-width: 448px; min-height: 100vh; background: #111827; display: flex; flex-direction: column; position: relative; overflow: hidden; }

    /* Top Bar */
    .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(8px); z-index: 20; }
    .back-btn { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #fff; font-size: 1.3rem; background: rgba(255,255,255,0.1); transition: background 0.15s; }
    .back-btn:hover { background: rgba(255,255,255,0.2); }
    .top-title { font-size: 1.15rem; font-weight: 600; color: #fff; }

    /* Viewfinder Container */
    .viewfinder-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; position: relative; }
    .viewfinder-box { width: 250px; height: 250px; position: relative; border-radius: 18px; border: 2px dashed rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; }

    /* Blue Corner Brackets */
    .corner { position: absolute; width: 28px; height: 28px; border-color: var(--primary); border-style: solid; }
    .corner-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 14px; }
    .corner-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 14px; }
    .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 14px; }
    .corner-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 14px; }

    /* Laser Line */
    .laser-line { position: absolute; left: 10px; right: 10px; height: 3px; background: linear-gradient(90deg, transparent, var(--primary), transparent); box-shadow: 0 0 15px var(--primary); animation: scanLaser 2.2s ease-in-out infinite; }

    @keyframes scanLaser {
      0% { top: 15px; opacity: 0.2; }
      50% { opacity: 1; }
      100% { top: 230px; opacity: 0.2; }
    }

    .instructions { text-align: center; margin-top: 32px; font-size: 0.9rem; color: #d1d5db; max-width: 280px; line-height: 1.5; }
    .scanning-pill { display: inline-flex; align-items: center; gap: 8px; background: rgba(63, 63, 233, 0.2); border: 1px solid rgba(63, 63, 233, 0.4); color: #c7d2fe; font-size: 0.8rem; font-weight: 500; padding: 6px 14px; border-radius: 20px; margin-top: 14px; }
    .spin-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); animation: pulse 1.2s infinite; }

    /* Bottom Controls */
    .controls-bar { display: flex; align-items: center; justify-content: space-around; padding: 24px 32px 36px; background: rgba(17, 24, 39, 0.95); z-index: 20; }
    .control-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; background: transparent; border: none; color: #d1d5db; cursor: pointer; font-size: 0.78rem; transition: color 0.15s; }
    .control-icon { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: #fff; transition: background 0.15s, transform 0.15s; }
    .control-btn:hover .control-icon { background: rgba(255,255,255,0.18); transform: scale(1.05); }
    .control-btn.active .control-icon { background: var(--primary); color: #fff; }

    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="app-shell">
    
    <!-- Top Bar -->
    <header class="top-bar">
      <a href="/emergencypay" class="back-btn">
        <i class="ri-arrow-left-line"></i>
      </a>
      <h1 class="top-title">Scan QR Code</h1>
      <div style="width: 38px;"></div>
    </header>

    <!-- Camera / Viewfinder -->
    <main class="viewfinder-area">
      <div class="viewfinder-box">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        <div class="laser-line"></div>
      </div>

      <p class="instructions">
        Align the merchant QR code within the frame to pay offline
      </p>

      <div class="scanning-pill">
        <span class="spin-dot"></span>
        <span id="scanStatus">Scanning offline beacon...</span>
      </div>
    </main>

    <!-- Controls -->
    <footer class="controls-bar">
      <button class="control-btn" id="torchBtn" onclick="toggleTorch()">
        <div class="control-icon"><i class="ri-flashlight-line"></i></div>
        <span>Torch</span>
      </button>

      <button class="control-btn" onclick="simulateDetectedQR()">
        <div class="control-icon" style="background:var(--primary);"><i class="ri-qr-code-line"></i></div>
        <span>Simulate QR</span>
      </button>

      <button class="control-btn" onclick="uploadGallery()">
        <div class="control-icon"><i class="ri-image-line"></i></div>
        <span>Gallery</span>
      </button>
    </footer>

  </div>

  <script>
    let torchActive = false;

    function toggleTorch() {
      torchActive = !torchActive;
      document.getElementById('torchBtn').classList.toggle('active', torchActive);
    }

    async function simulateDetectedQR() {
      document.getElementById('scanStatus').textContent = 'QR Code Detected!';
      try {
        const res = await fetch('/api/merchants');
        let merchantName = 'S.H.I.E.L.D Daycare';
        if (res.ok) {
          const list = await res.json();
          if (list.length > 0) {
            merchantName = list[Math.floor(Math.random() * list.length)].name;
          }
        }
        setTimeout(() => {
          window.location.href = `/pay?payee=${encodeURIComponent(merchantName)}&channel=QR%20Code`;
        }, 500);
      } catch (err) {
        window.location.href = `/pay?payee=S.H.I.E.L.D%20Daycare&channel=QR%20Code`;
      }
    }

    function uploadGallery() {
      alert('Simulating gallery image selection. A valid offline merchant QR will be loaded.');
      simulateDetectedQR();
    }

    // Auto-detect simulation after 4 seconds if untouched
    setTimeout(() => {
      document.getElementById('scanStatus').textContent = 'Merchant signal detected...';
      setTimeout(simulateDetectedQR, 1200);
    }, 4000);
  </script>
</body>
</html>
