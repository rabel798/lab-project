<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Project</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            text-align: center;
            padding: 40px;
            border-radius: 16px;
            background: #1e293b;
            box-shadow: 0 0 25px rgba(0,0,0,.35);
        }

        h1 {
            margin-bottom: 10px;
        }

        button {
            margin-top: 20px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1> Flask is Running</h1>
    <p>Your deployment pipeline is ready.</p>

    <button onclick="sayHello()">
        Click Me
    </button>
</div>

<script>
function sayHello() {
    alert("Hello from Flask!");
}
</script>

</body>
</html>
