<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>EmergencyPay - Transaction History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: #131b2e;
      --emerald-primary: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.25);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius-md: 14px;
      --radius-lg: 20px;
      --font-family: 'Exo 2', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); }
    .back-btn { color: var(--text-main); text-decoration: none; font-size: 1.2rem; display: flex; align-items: center; gap: 6px; }
    .header-title { font-weight: 700; font-size: 1.1rem; }

    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: var(--radius-md); }
    .tx-icon { width: 40px; height: 40px; border-radius: 50%; background: rgba(16, 185, 129, 0.15); color: var(--emerald-primary); display: grid; place-items: center; font-size: 1.2rem; }
    .tx-info { display: flex; flex-direction: column; gap: 2px; }
    .tx-title { font-size: 0.95rem; font-weight: 600; }
    .tx-meta { font-size: 0.75rem; color: var(--text-muted); }
    .tx-amount { font-weight: 700; font-size: 1rem; color: var(--emerald-primary); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/emergencypay" class="back-btn"><i class="ri-arrow-left-line"></i> Dashboard</a>
      <span class="header-title">Transaction Log</span>
      <div style="width: 24px;"></div>
    </header>

    <div class="card">
      <div class="history-list" id="historyContainer">
        <!-- Loaded dynamically -->
      </div>
    </div>
  </div>

  <script>
    const defaultHistory = [
      { payee: 'grocery@upi', amount: 350, timestamp: 'Today, 2:15 PM', channel: 'Bluetooth', token: 'EP-MESH-98A1' },
      { payee: 'pharmacy@okicici', amount: 120, timestamp: 'Yesterday, 6:40 PM', channel: 'Local Mesh', token: 'EP-MESH-44F2' }
    ];

    const history = JSON.parse(localStorage.getItem('ep_tx_history') || 'null') || defaultHistory;

    function renderList() {
      const container = document.getElementById('historyContainer');
      container.innerHTML = history.map(tx => `
        <div class="history-item">
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="tx-icon"><i class="ri-arrow-up-line"></i></div>
            <div class="tx-info">
              <span class="tx-title">${tx.payee}</span>
              <span class="tx-meta">${tx.timestamp || tx.date || 'Offline'} • ${tx.channel || 'Mesh'}</span>
            </div>
          </div>
          <div class="tx-amount">- ₹${tx.amount}</div>
        </div>
      `).join('');
    }

    renderList();
  </script>
</body>
</html>
